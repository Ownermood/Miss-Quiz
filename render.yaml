services:
  - type: web
    name: missquiz-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB
        value: quiz_bot
      - key: OWNER_ID
        value: 7970305771
      - key: MODE
        value: webhook
      - key: WEBHOOK_URL
        value: https://missquiz-bot.onrender.com
