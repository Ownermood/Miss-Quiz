<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Miss Quiz</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#0f1419);--card:var(--tg-theme-secondary-bg-color,#18202a);
  --txt:var(--tg-theme-text-color,#eef2f6);--mut:var(--tg-theme-hint-color,#8a99a8);
  --acc:var(--tg-theme-button-color,#3b82c4);--acct:var(--tg-theme-button-text-color,#fff);
  --ok:#2fa55a;--okbg:rgba(47,165,90,.14);--bad:#d9534f;--badbg:rgba(217,83,79,.13);--gold:#e8a317;
  --line:rgba(128,140,155,.22)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt)}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 28px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600}
h1{font-size:24px;line-height:1.25;margin:6px 0 16px;font-weight:750;word-break:break-word}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.facts div{background:var(--card);padding:12px 8px;text-align:center}
.facts b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.facts span{font-size:12px;color:var(--mut)}
.label{font-size:13px;color:var(--mut);margin:4px 0 8px;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:transparent;color:var(--txt);border-radius:999px;padding:7px 13px;font-size:14px;font-variant-numeric:tabular-nums}
.chip.on{border-color:var(--acc);background:var(--acc);color:var(--acct)}
.mode{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--txt);border-radius:16px;padding:15px;margin-bottom:10px;font:inherit;cursor:pointer}
.mode i{font-style:normal;font-size:24px;width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--bg)}
.mode b{display:block;font-size:17px}.mode span{font-size:13.5px;color:var(--mut)}
.mode.main{background:var(--ok);border-color:var(--ok);color:#fff}.mode.main span{color:rgba(255,255,255,.85)}.mode.main i{background:rgba(255,255,255,.18)}
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);font-weight:600}
.timer{font-variant-numeric:tabular-nums;color:var(--txt);padding:3px 10px;border-radius:999px;background:var(--card)}
.timer.low{color:#fff;background:var(--bad)}
.bar{height:4px;background:var(--line);border-radius:4px;margin:10px 0 18px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.q{font-size:18.5px;line-height:1.45;font-weight:650;margin:0 0 16px;white-space:pre-wrap;word-break:break-word}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--txt);border-radius:14px;padding:13px;margin-bottom:9px;font:inherit;cursor:pointer;transition:transform .08s}
.opt:active{transform:scale(.985)}.opt:disabled{cursor:default;transform:none}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--bg);color:var(--mut)}
.opt .t{word-break:break-word;padding-top:1px}
.opt.pick{border-color:var(--acc)}.opt.pick .k{background:var(--acc);color:var(--acct)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .k{background:var(--bad);color:#fff}
.exp{border-left:3px solid var(--gold);background:var(--card);border-radius:4px 12px 12px 4px;padding:11px 13px;margin-top:6px;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.verdict{font-weight:700;margin-bottom:4px}.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;cursor:pointer;background:var(--card);color:var(--txt)}
.btn.go{background:var(--ok);color:#fff}.btn.red{color:var(--bad)}
.btn:disabled{opacity:.55}
.score{text-align:center;padding:22px 16px}
.score .n{font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.score .n small{font-size:24px;color:var(--mut);font-weight:700}
.score p{margin:8px 0 0;color:var(--mut)}
.rv{padding:14px 0;border-top:1px solid var(--line)}.rv:first-of-type{border-top:0;padding-top:4px}
.rv .t{font-weight:650;margin-bottom:6px;white-space:pre-wrap;word-break:break-word}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;margin-bottom:6px}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.skip{background:rgba(232,163,23,.15);color:var(--gold)}
.line{font-size:14.5px;word-break:break-word}.line.mut{color:var(--mut)}
.center{text-align:center;padding:60px 20px;color:var(--mut)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style></head>
<body><div class="wrap" id="app"><div class="center"><div class="spin"></div>Loading quiz…</div></div>
<script>
(() => {
const tg = window.Telegram && window.Telegram.WebApp;
const app = document.getElementById("app");
const KEYS = "ABCDEFGHIJ", PART = 100;
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const haptic = t => { try { t === "ok" || t === "bad" ? tg.HapticFeedback.notificationOccurred(t === "ok" ? "success" : "error") : tg.HapticFeedback.impactOccurred("light"); } catch (e) {} };
const params = new URLSearchParams(location.search);
const sid = params.get("sid") || (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "";
let Q = null, part = 0, mode, list, idx, ans, timer, left, busy = false;

function fail(msg) { app.innerHTML = `<div class="center">${esc(msg)}</div>`; }
async function api(path, body) {
  const r = await fetch("/app/api/" + path, {method: "POST", headers: {"Content-Type": "application/json", "X-Init-Data": tg ? tg.initData : ""}, body: JSON.stringify(Object.assign({sid}, body || {}))});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
function back(fn) { if (!tg) return; tg.BackButton.offClick(back._f || (() => {})); back._f = fn; if (fn) { tg.BackButton.onClick(fn); tg.BackButton.show(); } else tg.BackButton.hide(); }

function partRange(p) { return [p * PART, Math.min(Q.count, (p + 1) * PART)]; }
function home() {
  clearInterval(timer); back(null);
  const parts = Math.ceil(Q.count / PART);
  const [a, b] = partRange(part);
  const n = b - a;
  const chips = parts > 1 ? `<div class="label">Questions</div><div class="chips">${Array.from({length: parts}, (_, p) => { const [x, y] = partRange(p); return `<button class="chip${p === part ? " on" : ""}" data-p="${p}">${x + 1}–${y}</button>`; }).join("")}</div>` : "";
  app.innerHTML = `<div class="eyebrow">Miss Quiz</div><h1>${esc(Q.title)}</h1>
  <div class="facts"><div><b>${n}</b><span>Questions</span></div><div><b>${Q.secs}s</b><span>Each</span></div><div><b>${Q.negative ? "−" + Q.negative : "0"}</b><span>Negative</span></div></div>
  ${chips}
  <button class="mode main" data-m="practice"><i>🎯</i><div><b>Practice</b><span>Answer and explanation after every question</span></div></button>
  <button class="mode" data-m="exam"><i>📝</i><div><b>Exam</b><span>Like the real test. Full review at the end</span></div></button>`;
  app.querySelectorAll(".chip").forEach(el => el.onclick = () => { part = +el.dataset.p; haptic(); home(); });
  app.querySelectorAll(".mode").forEach(el => el.onclick = () => start(el.dataset.m));
}
function start(m) {
  mode = m; const [a, b] = partRange(part);
  list = Q.questions.slice(a, b); idx = 0; ans = {}; haptic();
  back(() => { if (!Object.keys(ans).length) return home(); try { tg.showConfirm("Quit this quiz? Your answers will be lost.", ok => ok && home()); } catch (e) { home(); } });
  show();
}
function show() {
  clearInterval(timer); busy = false;
  const q = list[idx]; left = Q.secs;
  app.innerHTML = `<div class="qtop"><span>${mode === "exam" ? "📝 Exam" : "🎯 Practice"} · ${idx + 1} / ${list.length}</span><span class="timer" id="tm">${left}s</span></div>
  <div class="bar"><i style="width:${idx / list.length * 100}%"></i></div>
  <div class="q">${esc(q.q)}</div>
  <div id="opts">${q.o.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${KEYS[i] || i + 1}</span><span class="t">${esc(o)}</span></button>`).join("")}</div>
  <div id="after"></div>
  <div class="row" id="row"><button class="btn" id="skip">Skip</button></div>`;
  app.querySelectorAll(".opt").forEach(el => el.onclick = () => pick(+el.dataset.i));
  document.getElementById("skip").onclick = () => pick(-1);
  window.scrollTo(0, 0);
  timer = setInterval(() => { left--; const t = document.getElementById("tm"); if (!t) return; t.textContent = Math.max(left, 0) + "s"; t.classList.toggle("low", left <= 5); if (left <= 0) pick(-1); }, 1000);
}
async function pick(i) {
  const q = list[idx];
  if (busy || ans[q.i] !== undefined) return;
  busy = true; clearInterval(timer); ans[q.i] = i;
  const btns = [...app.querySelectorAll(".opt")]; btns.forEach(b => b.disabled = true);
  if (i >= 0) btns[i].classList.add("pick");
  if (mode === "exam") { haptic(); setTimeout(next, 280); return; }
  let r;
  try { r = await api("check", {i: q.i, c: i}); } catch (e) { r = null; }
  const row = document.getElementById("row");
  if (r) {
    if (btns[r.a]) btns[r.a].classList.add("ok");
    if (i >= 0 && i !== r.a) btns[i].classList.add("bad");
    haptic(i === r.a ? "ok" : "bad");
    const v = i < 0 ? `<div class="verdict">⏭ Skipped</div>` : i === r.a ? `<div class="verdict ok">✓ Correct</div>` : `<div class="verdict bad">✗ Wrong</div>`;
    document.getElementById("after").innerHTML = `<div class="exp">${v}${r.e ? esc(r.e) : ""}</div>`;
  } else {
    document.getElementById("after").innerHTML = `<div class="exp">Couldn't check this answer. Your pick is saved.</div>`;
  }
  row.innerHTML = `<button class="btn go" id="nx">${idx + 1 < list.length ? "Next" : "See result"}</button>`;
  document.getElementById("nx").onclick = next;
}
function next() { idx++; idx < list.length ? show() : result(); }
async function result() {
  clearInterval(timer);
  app.innerHTML = `<div class="center"><div class="spin"></div>Checking your answers…</div>`;
  let r;
  try { r = await api("submit", {answers: ans, asked: list.map(q => q.i)}); }
  catch (e) { app.innerHTML = `<div class="center">Couldn't submit. Check your connection.<div class="row"><button class="btn go" id="rt">Try again</button></div></div>`; document.getElementById("rt").onclick = result; return; }
  back(home);
  const byI = Object.fromEntries(r.review.map(x => [x.i, x]));
  const pct = r.total ? Math.round(r.correct / r.total * 100) : 0;
  const msg = pct >= 80 ? "Excellent work 🏆" : pct >= 50 ? "Good effort, keep going 💪" : "Practice makes perfect 📚";
  haptic(pct >= 50 ? "ok" : "bad");
  app.innerHTML = `<div class="card score"><div class="eyebrow">${mode === "exam" ? "Exam" : "Practice"} result</div>
    <div class="n" style="margin-top:10px">${r.score}<small> / ${r.total}</small></div><p>${msg}</p></div>
  <div class="facts"><div><b style="color:var(--ok)">${r.correct}</b><span>Correct</span></div><div><b style="color:var(--bad)">${r.wrong}</b><span>Wrong</span></div><div><b>${r.skipped}</b><span>Skipped</span></div></div>
  <div class="row" style="margin:0 0 12px"><button class="btn" id="hm">Home</button><button class="btn go" id="again">Play again</button></div>
  <div class="card"><div class="label" style="margin-top:0">Review</div>${list.map((q, n) => {
    const x = byI[q.i] || {}, a = ans[q.i], s = a === x.a ? "ok" : (a === undefined || a < 0) ? "skip" : "bad";
    return `<div class="rv"><div class="t">${n + 1}. ${esc(q.q)}</div>
      <span class="tag ${s}">${s === "ok" ? "Correct" : s === "bad" ? "Wrong" : "Skipped"}</span>
      ${s === "bad" ? `<div class="line mut">Your answer: ${esc(q.o[a])}</div>` : ""}
      <div class="line">✓ ${esc(q.o[x.a])}</div>${x.e ? `<div class="exp">${esc(x.e)}</div>` : ""}</div>`;
  }).join("")}</div>`;
  document.getElementById("hm").onclick = home;
  document.getElementById("again").onclick = () => start(mode);
}

if (!tg || !tg.initData) return fail("Open this from Miss Quiz Bot in Telegram.");
tg.ready(); tg.expand();
try { tg.setHeaderColor("secondary_bg_color"); } catch (e) {}
if (!sid) return fail("No quiz selected. Open a quiz card in the bot and tap 📱 Open in App.");
api("quiz").then(d => { Q = d; if (!Q.count) return fail("This quiz has no questions."); home(); })
  .catch(e => fail(String(e.message) === "404" ? "This quiz was not found or was deleted." : "Couldn't load the quiz. Please try again."));
})();
</script></body></html>
