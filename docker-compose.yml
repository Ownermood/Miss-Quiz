services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "1"]
    volumes:
      - mongo_data:/data/db

  bot:
    build: .
    restart: unless-stopped
    depends_on: [mongo]
    env_file:
      - .env
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MODE: polling
    volumes:
      - ./data:/app/data

volumes:
  mongo_data:
